name: Build and Publish Chrome Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Verify required files
        run: |
          set -euo pipefail
          for file in \
            manifest.json content.js background.js \
            popup.html popup.js mns-raf-experiment-main.js \
            icons/icon.svg icons/icon16.png icons/icon32.png \
            icons/icon48.png icons/icon128.png; do
            test -f "$file"
          done

      - name: Check JavaScript
        run: |
          node --check content.js
          node --check background.js
          node --check popup.js
          node --check mns-raf-experiment-main.js

      - name: Run tests
        run: node --test *.test.cjs

      - name: Package extension
        run: |
          set -euo pipefail
          mkdir -p dist

          zip -q -X "dist/MeetNameSentry-${GITHUB_REF_NAME}.zip" \
            manifest.json \
            content.js \
            background.js \
            popup.html \
            popup.js \
            mns-raf-experiment-main.js \
            icons/icon.svg \
            icons/icon16.png \
            icons/icon32.png \
            icons/icon48.png \
            icons/icon128.png

          unzip -t "dist/MeetNameSentry-${GITHUB_REF_NAME}.zip"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "MeetNameSentry $GITHUB_REF_NAME" \
            --notes "优化后台名单辅助与静默巡检，改善启动时的弹窗误阻塞，并加强扩展安全性。保留原有姓名规则与自动移出功能。"
