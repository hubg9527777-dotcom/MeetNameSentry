<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：Google 经典科技蓝 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#1557B0"/>
    </linearGradient>

    <!-- 字母 S 渐变：极客翠绿 -->
    <linearGradient id="neonS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>

    <!-- 45° 刀锋锐利切割遮罩 (右上与左下切口) -->
    <mask id="bladeMask">
      <rect width="128" height="128" fill="#ffffff"/>
      <line x1="88" y1="34" x2="112" y2="58" stroke="#000000" stroke-width="4.5"/>
      <line x1="66" y1="70" x2="90" y2="94" stroke="#000000" stroke-width="4.5"/>
    </mask>
  </defs>

  <!-- Google 91% 铺满大圆角矩形底座 -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- 左侧：纯白重磅字母 M -->
  <path d="M 18 34 L 31.5 34 L 41.5 60.5 L 51.5 34 L 65 34 L 65 94 L 54 94 L 54 53 L 45 75.5 L 38 75.5 L 29 53 L 29 94 L 18 94 Z" fill="#FFFFFF"/>

  <!-- 右侧：刀锋哨兵字母 S -->
  <path d="M 108 49 C 107 41 99 34 88 34 C 76 34 70 41 70 50 C 70 58 77 62 88 66 C 100 70 108 74.5 108 83.5 C 108 92.5 100 96 88 96 C 75 96 68 89 67 80 L 79 78 C 80 84 83 87 88 87 C 94 87 97 84 97 80 C 97 76 93 73 83 69 C 72 65 65 60 65 51 C 65 41 73 35 86 35 C 97 35 106 41 107 49 Z" fill="url(#neonS)" mask="url(#bladeMask)"/>
</svg>
