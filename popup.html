<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MeetNameSentry</title>
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --ink: #1d2320; --muted: #66706a; --line: #dfe3dc;
    --accent: #2f7d4f; --warn: #b4670a; --err: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171a18; --panel: #202421; --ink: #e8ece8; --muted: #9aa49d; --line: #333a35; --accent: #5cc08a; --warn: #e0a34a; --err: #f08a82; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--ink);
    font: 13px/1.5 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 14px 16px 10px; }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

  .switches { margin: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row b { display: block; font-weight: 600; }
  .row small { color: var(--muted); font-size: 12px; }

  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fields { padding: 12px 16px 4px; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  label small { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type="text"], textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; resize: vertical;
  }
  input[type="text"]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-weight: 600; }
  details label { margin-top: 8px; }

  footer { display: flex; justify-content: space-between; gap: 8px; padding: 8px 16px 14px; min-height: 36px; color: var(--muted); font-size: 12px; }
  #status.ok { color: var(--accent); } #status.warn { color: var(--warn); } #status.err { color: var(--err); }
</style>
</head>
<body>
  <header>
    <h1>MeetNameSentry</h1>
    <p>名字不含指定关键词的参会者会被移出会议（需主持人权限）。</p>
  </header>

  <section class="switches">
    <div class="row">
      <div><b>启用巡检</b><small>关闭后不再扫描，也不会点击任何按钮</small></div>
      <label class="switch"><input type="checkbox" id="enabled" /><span></span></label>
    </div>
    <div class="row">
      <div><b>试运行</b><small>只提示不合规的人，不真正移出</small></div>
      <label class="switch"><input type="checkbox" id="dryRun" /><span></span></label>
    </div>
  </section>

  <div class="fields">
    <label>名字必须包含
      <input type="text" id="requiredKeywords" placeholder="例如：AA，BB" autocomplete="off" />
      <small>多个关键词用逗号分隔，满足任意一个即合规，不区分大小写和全半角。留空则不会移出任何人。</small>
    </label>
    <label>关键词白名单
      <input type="text" id="keywordWhitelist" placeholder="例如：助教，TA" autocomplete="off" />
      <small>名字里含有这些词的人直接放行。</small>
    </label>
    <label>姓名白名单
      <textarea id="exactWhitelist" rows="3" placeholder="每行一个完整姓名"></textarea>
    </label>
    <details>
      <summary>高级：额外的“移出”菜单文案</summary>
      <label>
        <textarea id="extraRemoveLabels" rows="2" placeholder="每行一个，例如：从这场通话中移出"></textarea>
        <small>你的 Meet 界面语言没被内置词库覆盖时，在这里补充菜单项的完整文字。仅完整匹配；找不到唯一的“移出”项时会停止操作。</small>
      </label>
    </details>
  </div>

  <footer><span id="status"></span><span id="size"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
